callouty-theorem:
  thm:
    override-title: false # do not override the title of the callout (title won't show when `appearance` set to `simple` or `minimal`)
    callout: # parameters of the wrapping callout. see Quarto documentation of callouts for more details
      type: note
      appearance: minimal
  prp:
    override-title: false
    callout:
      type: note
      appearance: minimal
  exr:
    override-title: false
    callout:
      type: tip
      appearance: minimal
  proof: # also support wrapping proof-like environments
    override-title: true # override the title of the callout by the name of the theorem
    callout:
      type: note
      appearance: default
      collapse: true
      icon: true
  solution:
    override-title: true
    callout:
      type: tip
      appearance: default
      collapse: true
      icon: true
  remark:
    override-title: true
    callout:
      type: tip
      appearance: default
      collapse: true
      icon: true
  exm:
    override-title: false
    callout:
      type: caution
      appearance: minimal
      collapse: false

  # theorems types not specified in the metadata will be rendered as is
  cor:
    override-title: false
    callout:  # also support default style here
      appearance: minimal
      type: note
      collapse: false
   
  def:
    override-title: false
    callout:  # also support default style here
      appearance: minimal
      type: note
      collapse: false

editor:
  render-on-save: true

