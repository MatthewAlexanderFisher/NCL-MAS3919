project:
  type: book
  output-dir: docs
  resources:
    - service-worker.js
    - pwa/manifest.webmanifest
    - pwa/offline.html
    - pwa/icons/*

crossref:
  chapters: true
  custom:
    - kind: float
      key: q
      reference-prefix: "Question"

execute:
  engine: jupyter
  # debug: true
  # error: true
  jupyter: mas2901


book:
  title: "MAS3919: Foundations of Machine Learning"
  author: "Chris Oates and Matthew Fisher"
  date: ""
  chapters:
    - index.qmd
    - part: "Lecture Notes"
      chapters:
        - content/main/1-overview-of-machine-learning.qmd
        - content/main/2-machine-learning-models.qmd
        - content/main/3-stochastic-optimisation.qmd
        - content/main/4-generalisation-error.qmd
        - content/main/5-online-supervised-learning.qmd
        - content/main/6-beyond-supervised-learning.qmd
        - content/main/7-ethics-of-ml.qmd
    - part: "Practicals"
      chapters:
        - content/practicals/1-intro-to-pytorch.ipynb
        - content/practicals/2-ml-models-in-pytorch.ipynb
        - content/practicals/3-training-ml-models-in-pytorch.ipynb
    - part: "Additional Material"
      chapters:
        - content/appendix/formula-sheet.qmd
        - content/appendix/revision-sheet.qmd
        - content/appendix/question-bank.qmd
        - content/practicals/assignment-setup.ipynb
  sidebar:
    style: floating
    search: true
  navbar: 
    title: ""
    logo: images/ncl_logo_light.png
    search: false
  search:
    location: sidebar
    type: textbox
    keyboard-shortcut: "F"

