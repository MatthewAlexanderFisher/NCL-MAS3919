      - theming/advanced.css
      - theming/callout-preview.css
    include-after-body:
      - theming/no-xref-suffix.html
      - theming/close-codefold.html
      - theming/header.html
      - theming/callout-prefix-removal.html
      # - theming/zoom-button.html
      - theming/print-button.html
      - js/inkpad.html
      - js/callout-preview.html
      - theming/ink-button.html
      - theming/reading-mode-progress.html
      - text: |
          <script src="https://unpkg.com/@popperjs/core@2"></script>
          <script src="https://unpkg.com/tippy.js@6"></script>

    include-in-header: 
          # - theming/favicons.html
          - pwa/pwa-head.html
          
